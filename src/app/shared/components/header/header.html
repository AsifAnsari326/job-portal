<header class="header">
  <a routerLink="/dashboard" class="header__brand">
    <span class="header__logo"><i class="bi bi-briefcase-fill"></i></span>
    <span class="header__brand-text">Hyre</span>
  </a>

  <button class="header__menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
    <i class="bi bi-list"></i>
  </button>

  <nav class="header__nav" [class.header__nav--open]="menuOpen()">
    @if (currentUser()) {
      <a class="header__link" routerLink="/jobs" (click)="closeMenu()">Find jobs</a>
      <a class="header__link" routerLink="/dashboard?tab=saved" (click)="closeMenu()">Saved</a>
      <a class="header__link" routerLink="/dashboard?tab=applications" (click)="closeMenu()">Applications</a>
      <a class="header__user" routerLink="/dashboard" (click)="closeMenu()">
        <span class="header__avatar">{{ userInitial }}</span>
        <span class="header__user-name">{{ currentUser()?.fullname || 'User' }}</span>
      </a>
      <button class="header__logout" type="button" (click)="logout()">Log out</button>
    } @else {
      <a class="header__link" routerLink="/login" (click)="closeMenu()">Log in</a>
      <a class="header__link header__link--accent" routerLink="/signup" (click)="closeMenu()">Sign up</a>
    }
  </nav>
</header>
